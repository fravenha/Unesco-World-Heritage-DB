{% extends "base.html" %}
{% block content %}
<style>
    table {
        margin: 0 auto; /* Centers the table horizontally */
        border-collapse: collapse; /* Ensures no extra space between table borders */
    }

    th, td {
        text-align: center; /* Centers text in the table cells */
        padding: 10px; /* Adds padding for readability */
    }

    th {
        font-weight: bold; /* Makes the header bold for emphasis */
    }

    h1 {
        text-align: center; /* Centers the heading text */
    }
</style>

<h1>Número de Patrimónios que estiveram em Risco em qualquer altura</h1>
<table>
    <thead>
        <tr>
            <th>Patrimónios</th>
        </tr>
    </thead>
    <tbody>
        {% for site in sites %}
        <tr>
            <td>{{ site['name'] }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
